<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQOHc3XoWNWaPTFTtnwlxjq6UvAduVHK4",
    authDomain: "tarihkz.firebaseapp.com",
    projectId: "tarihkz",
    storageBucket: "tarihkz.firebasestorage.app",
    messagingSenderId: "1011942319854",
    appId: "1:1011942319854:web:4f9df7daeb7e76d7cd75ff",
    measurementId: "G-CX7NDF54B0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.dbSaveScore = async function(userName, score, total, quizTitle) {
    try {
      await addDoc(collection(db, "leaderboard"), {
        name: userName,
        points: score,
        scoreText: `${score}/${total}`,
        quizTitle: quizTitle,
        timestamp: new Date().toLocaleDateString('kk-KZ', { day: '2-digit', month: '2-digit' })
      });
      alert(dict[currentLang].saveSuccess);
      window.switchTab('leaders');
    } catch (e) {
      console.error("Cloud Error: ", e);
      alert(dict[currentLang].saveError);
    }
  };

  window.dbFetchLeaders = async function() {
    try {
      const q = query(collection(db, "leaderboard"), orderBy("points", "desc"), limit(20));
      const querySnapshot = await getDocs(q);
      const leaders = [];
      querySnapshot.forEach((doc) => {
        leaders.push(doc.data());
      });
      return leaders;
    } catch (e) {
      console.warn("Error fetching leaders:", e);
      return [];
    }
  };
</script>

let activeQuiz = null;
let currentQIdx = 0;
let userScore = 0;
let selectedOpt = null;

let essayTimerInterval = null;
let essayTimeLeft = 5400; 
let activeEssayTopic = null;

function toggleTheme() {
  const body = document.body;
  const currentTheme = body.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  body.setAttribute('data-theme', newTheme);
  document.getElementById('theme-btn').innerText = newTheme === 'dark' ? 'Light' : 'Dark';
}

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('sub-title').innerText = dict[lang].subTitle;
  document.getElementById('label-home').innerText = dict[lang].home;
  document.getElementById('label-tests').innerText = dict[lang].tests;
  document.getElementById('label-essay').innerText = dict[lang].essay;
  document.getElementById('label-leaders').innerText = dict[lang].leaders;
  renderHome();
}

function switchTab(tab) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`nav-${tab}`)?.classList.add('active');
  if (tab === 'home') renderHome();
  if (tab === 'tests') renderTests();
  if (tab === 'essay') renderEssayTopics();
  if (tab === 'leaders') renderLeaders();
}

function renderHome() {
  const d = dict[currentLang];
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h2>${d.welcome}</h2>
      <p class="desc">${d.welcomeDesc}</p>
      <button class="btn-btn btn-primary" onclick="switchTab('tests')">${d.startQuizBtn}</button>
    </div>
  `;
}

function renderTests() {
  const d = dict[currentLang];
  const app = document.getElementById('app');
  let html = `<h2>${d.topicsHeader}</h2>`;
  
  QUIZZES.forEach(q => {
    html += `
      <div class="card">
        <h2>${q.title[currentLang]}</h2>
        <button class="btn-btn btn-accent" onclick="startQuiz('${q.id}')">${d.start}</button>
      </div>
    `;
  });
  app.innerHTML = html;
}

function startQuiz(id) {
  activeQuiz = QUIZZES.find(q => q.id === id);
  currentQIdx = 0;
  userScore = 0;
  renderQuestion();
}

function renderQuestion() {
  const d = dict[currentLang];
  const qData = activeQuiz.questions[currentQIdx];
  selectedOpt = null;
  const progress = ((currentQIdx + 1) / activeQuiz.questions.length) * 100;

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <div class="progress-bar"><div class="progress-fill" style="width: ${progress}%"></div></div>
      <p class="desc">${currentQIdx + 1} / ${activeQuiz.questions.length}</p>
      <h2>${qData.q[currentLang]}</h2>
      <div id="opts-container" style="margin-top: 15px;">
        ${qData.opts.map((opt, i) => `
          <button class="opt-btn" onclick="selectAnswer(${i})">${opt}</button>
        `).join('')}
      </div>
      <button id="next-btn" class="btn-btn btn-primary" style="margin-top: 15px; display: none;" onclick="nextQuestion()">
        ${currentQIdx + 1 === activeQuiz.questions.length ? d.finishQ : d.nextQ}
      </button>
    </div>
  `;
}

function selectAnswer(idx) {
  if (selectedOpt !== null) return;
  selectedOpt = idx;
  const qData = activeQuiz.questions[currentQIdx];
  const btns = document.querySelectorAll('.opt-btn');

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === qData.correct) {
      btn.classList.add('correct');
    }
    if (i === idx && idx !== qData.correct) {
      btn.classList.add('incorrect');
    }
  });

  if (idx === qData.correct) {
    userScore++;
  }
  document.getElementById('next-btn').style.display = 'flex';
}

function nextQuestion() {
  currentQIdx++;
  if (currentQIdx < activeQuiz.questions.length) {
    renderQuestion();
  } else {
    renderResult();
  }
}

function renderResult() {
  const d = dict[currentLang];
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card" style="text-align: center;">
      <h2>${d.result}</h2>
      <p style="font-size: 2rem; font-weight: 800; color: var(--primary); margin: 15px 0;">
        ${userScore} / ${activeQuiz.questions.length}
      </p>
      <p class="desc">${d.correctAnswers}: ${userScore}</p>
      <button class="btn-btn btn-primary" onclick="saveScorePrompt()" style="margin-bottom: 10px;">${d.save}</button>
      <button class="btn-btn btn-outline" onclick="renderTests()">${d.restart}</button>
    </div>
  `;
}

async function saveScorePrompt() {
  const d = dict[currentLang];
  const name = prompt(d.enterNamePrompt);
  if (name && name.trim() !== "") {
    if (window.dbSaveScore) {
      await window.dbSaveScore(name.trim(), userScore, activeQuiz.questions.length, activeQuiz.title[currentLang]);
    } else {
      alert(d.saveError);
    }
  }
}

function renderEssayTopics() {
  clearInterval(essayTimerInterval);
  const d = dict[currentLang];
  const app = document.getElementById('app');
  let html = `<h2>${d.essayTitleHeader}</h2>`;
  
  ESSAY_TOPICS.forEach(topic => {
    html += `
      <div class="card">
        <h2>${topic.title[currentLang]}</h2>
        <p class="desc">${d.essayTimeDesc}</p>
        <button class="btn-btn btn-primary" onclick="startEssay(${topic.id})">${d.writeEssayBtn}</button>
      </div>
    `;
  });
  app.innerHTML = html;
}

function startEssay(topicId) {
  const d = dict[currentLang];
  activeEssayTopic = ESSAY_TOPICS.find(t => t.id === topicId);
  essayTimeLeft = 5400; 
  
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <span class="timer-badge" id="essay-timer">${d.timerLabel}: 01:30:00</span>
      <h2 style="font-size: 1.1rem; margin-bottom: 12px;">${activeEssayTopic.title[currentLang]}</h2>
      
      <input type="text" id="student-name" class="input-field" placeholder="${d.namePlaceholder}">
      <input type="email" id="teacher-email" class="input-field" placeholder="${d.emailPlaceholder}">
      
      <textarea id="essay-text" class="essay-textarea" placeholder="${d.essayTextareaPlaceholder}" oninput="updateEssayStats()"></textarea>
      
      <div style="display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-sub); margin-bottom: 16px;">
        <span id="char-count">${d.charCount}: 0</span>
        <span id="word-count">${d.wordCount}: 0</span>
      </div>

      <button class="btn-btn btn-primary" onclick="downloadEssay()" style="margin-bottom: 10px;">
        ${d.saveFileBtn}
      </button>
      <button class="btn-btn btn-accent" onclick="sendEssayViaGmail()">
        ${d.sendGmailBtn}
      </button>
      <button class="btn-btn btn-outline" onclick="renderEssayTopics()" style="margin-top: 10px;">
        ${d.cancelBtn}
      </button>
    </div>
  `;

  startEssayTimer();
}

function startEssayTimer() {
  const d = dict[currentLang];
  clearInterval(essayTimerInterval);
  essayTimerInterval = setInterval(() => {
    essayTimeLeft--;
    if (essayTimeLeft <= 0) {
      clearInterval(essayTimerInterval);
      alert(d.timeUpAlert);
    }
    const timerElem = document.getElementById('essay-timer');
    if (timerElem) {
      const h = Math.floor(essayTimeLeft / 3600);
      const m = Math.floor((essayTimeLeft % 3600) / 60);
      const s = essayTimeLeft % 60;
      timerElem.innerText = `${d.timerLabel}: ${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }
  }, 1000);
}

function updateEssayStats() {
  const d = dict[currentLang];
  const text = document.getElementById('essay-text').value;
  document.getElementById('char-count').innerText = `${d.charCount}: ${text.length}`;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').innerText = `${d.wordCount}: ${words}`;
}

function downloadEssay() {
  const d = dict[currentLang];
  const name = document.getElementById('student-name').value.trim() || "Student";
  const text = document.getElementById('essay-text').value;
  if (!text.trim()) {
    alert(d.emptyEssayAlert);
    return;
  }
  
  const content = `Student: ${name}\nTopic: ${activeEssayTopic.title[currentLang]}\nDate: ${new Date().toLocaleDateString()}\n\nEssay Text:\n${text}`;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Essay_${name.replace(/\s+/g, '_')}.txt`;
  link.click();
}

function sendEssayViaGmail() {
  const d = dict[currentLang];
  const teacherEmail = document.getElementById('teacher-email').value.trim();
  const name = document.getElementById('student-name').value.trim() || "Student";
  const text = document.getElementById('essay-text').value;

  if (!teacherEmail) {
    alert(d.noEmailAlert);
    return;
  }
  if (!text.trim()) {
    alert(d.emptyEssayAlert);
    return;
  }

  const subject = encodeURIComponent(`Essay HK6002: ${activeEssayTopic.title[currentLang]} (${name})`);
  const body = encodeURIComponent(`Student: ${name}\nTopic: ${activeEssayTopic.title[currentLang]}\n\nText:\n${text}`);
  
  const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${teacherEmail}&su=${subject}&body=${body}`;
  window.open(gmailUrl, '_blank');
}

async function renderLeaders() {
  const d = dict[currentLang];
  const app = document.getElementById('app');
  app.innerHTML = `<div class="card"><h2>${d.loadingLeaders}</h2></div>`;

  let leaders = [];
  if (window.dbFetchLeaders) {
    leaders = await window.dbFetchLeaders();
  }

  let html = `<div class="card"><h2>${d.leadersTitle}</h2>`;
  if (leaders.length === 0) {
    html += `<p class="desc">${d.noLeaders}</p>`;
  } else {
    leaders.forEach((item, index) => {
      html += `
        <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border);">
          <span><strong>#${index + 1} ${item.name}</strong></span>
          <span style="color: var(--primary); font-weight: 700;">${item.scoreText || item.points}</span>
        </div>
      `;
    });
  }
  html += `</div>`;
  app.innerHTML = html;
}

renderHome();
